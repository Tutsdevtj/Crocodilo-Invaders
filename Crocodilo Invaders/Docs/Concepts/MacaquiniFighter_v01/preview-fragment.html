  <script>
  (()=>{
    const root=document.getElementById('macaquini-fighter-study');
    const canvas=root.querySelector('#mf-arena'),ctx=canvas.getContext('2d');
    const selector=root.querySelector('#mf-attack'),button=root.querySelector('#mf-play');
    const caption=root.querySelector('#mf-name'),status=root.querySelector('#mf-state'),detail=root.querySelector('#mf-detail');
    const progress=root.querySelector('#mf-progress'),track=root.querySelector('[role="progressbar"]');
    const raw=JSON.parse(root.querySelector('#mf-assets').textContent),images={};
    const moves=[
      {id:'jab',name:'Direto + cruzado',duration:5.6,detail:'Esquiva vertical; o dash recarrega entre os socos. Contra-ataque depois do cruzado.'},
      {id:'upper',name:'Gancho ascendente',duration:5.6,detail:'Ele recolhe o braço e vem de baixo: escape para o lado, não para cima.'},
      {id:'dive',name:'Martelo de mergulho',duration:5.8,detail:'As duas mãos sobem e a marca trava: saia do círculo antes da queda.'},
      {id:'kick',name:'Chute do cipó · existente',duration:7.2,detail:'O chute atual fecha algumas combinações; a volta ao fundo continua.'}
    ];
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let elapsed=0,playing=!reduced,last=0,lastLabel='',mode='all',palette={};
    const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
    const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
    const ease=(t,a,b)=>smooth((t-a)/(b-a));
    const probe=document.createElement('span');probe.className='sr-only';probe.setAttribute('aria-hidden','true');root.append(probe);
    function colors(){for(const [k,v] of Object.entries({warning:'--orange',danger:'--red',dodge:'--blue',open:'--green',ink:'--foreground',surface:'--background'})){probe.style.color='var('+v+')';palette[k]=getComputedStyle(probe).color;}}
    function setChoice(value,save){mode=moves.some(m=>m.id===value)?value:'all';selector.value=mode;elapsed=0;lastLabel='';if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'Macaquini lutador',golpe:mode},privateContent:{selectedAttack:mode}}).catch(()=>{});}
    const saved=window.openai?.widgetState;setChoice(saved?.privateContent?.selectedAttack||'all',false);
    window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(state?.privateContent?.selectedAttack)setChoice(state.privateContent.selectedAttack,false);});
    selector.addEventListener('change',()=>{setChoice(selector.value,true);playing=true;button.textContent='Pausar';});
    button.addEventListener('click',()=>{if(elapsed>=duration())elapsed=0;playing=!playing;button.textContent=playing?'Pausar':'Reproduzir';});
    function duration(){return mode==='all'?moves.reduce((s,m)=>s+m.duration,0):moves.find(m=>m.id===mode).duration;}
    function selected(){if(mode!=='all')return {move:moves.find(m=>m.id===mode),t:elapsed};let time=elapsed;for(const move of moves){if(time<=move.duration)return {move,t:time};time-=move.duration;}return {move:moves[3],t:moves[3].duration};}
    function sprite(name,x,y,scale=1,rotation=0,flip=false,alpha=1){const im=images[name];if(!im)return;ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(flip?-scale:scale,scale);ctx.globalAlpha=alpha;ctx.drawImage(im,-196,-240,384,384);ctx.restore();}
    function player(x,y,dash=false){const im=images.player;if(!im)return;ctx.save();if(dash){for(let i=1;i<4;i++){ctx.globalAlpha=.24/i;ctx.drawImage(im,x-45,y+18*i-23,90,57);}}ctx.globalAlpha=1;ctx.drawImage(im,x-45,y-28,90,57);ctx.restore();}
    function line(points,color,width=4,alpha=1,dash=[]){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.setLineDash(dash);ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
    function ring(x,y,r,color,alpha=1,dashed=false){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=4;if(dashed)ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
    function zone(x,y,w,h,color,alpha=.18){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.restore();}
    function path(points,color=palette.warning){line(points,color,3,.9,[10,8]);const a=points[points.length-2],b=points[points.length-1],angle=Math.atan2(b[1]-a[1],b[0]-a[0]);line([[b[0]-20*Math.cos(angle-.5),b[1]-20*Math.sin(angle-.5)],b,[b[0]-20*Math.cos(angle+.5),b[1]-20*Math.sin(angle+.5)]],color,3);}
    function hanging(x,y,roll=0){line([[770,-10],[x+35,y-155]],palette.open,5,.7);sprite('hang',x,y,.85,roll);}
    function impact(x,y,u){for(let i=0;i<3;i++)ring(x,y,22+u*90+i*17,palette.warning,Math.max(0,1-u-i*.22));}
    function arena(){const bg=images.jungle;if(bg){const x=-10+Math.sin(elapsed*.17)*8;ctx.drawImage(bg,x,-5,1020,575);}else{ctx.fillStyle=palette.surface;ctx.fillRect(0,0,1000,560);}if(images.trunks){ctx.globalAlpha=.65;ctx.drawImage(images.trunks,-10+Math.sin(elapsed*.25)*10,0,1020,560);ctx.globalAlpha=1;}if(images.canopy)ctx.drawImage(images.canopy,-12+Math.sin(elapsed*.4)*10,0,1024,560);const vine=images.vine;if(vine){for(let i=0;i<4;i++){ctx.save();ctx.globalAlpha=i<2?.45:.75;ctx.translate([30,970,120,900][i],-80);ctx.rotate(Math.sin(elapsed*.5+i)*.025);ctx.drawImage(vine,-22,0,45,360);ctx.restore();}}}
    function drawJab(t){let phase='Aviso',bx=755,by=300,pose='hang',rot=0,px=430,py=330,dash=false;
      if(t<.9){hanging(bx+Math.sin(t*7)*22,by);path([[650,298],[390,298]]);}
      else if(t<1.48){phase='Direto';const u=ease(t,.9,1.17);bx=lerp(755,565,u);pose='f1';by=390;px=430;py=lerp(330,430,ease(t,.87,1.17));zone(340,245,260,95,palette.danger);line([[620,310],[420,310]],palette.warning,8,.45);sprite(pose,bx,by,.9);}
      else if(t<2.2){phase='Segundo aviso';bx=575;by=320;pose='f0';py=430;sprite(pose,bx,by,.9);path([[535,385],[340,385]]);}
      else if(t<3){phase='Cruzado';bx=lerp(575,500,ease(t,2.2,2.52));by=455;pose='f2';py=lerp(430,285,ease(t,2.18,2.49));zone(300,340,240,110,palette.danger);line([[560,375],[335,375]],palette.warning,8,.5);sprite(pose,bx,by,.9);}
      else{phase='Abertura';const u=ease(t,3.55,4.8);bx=lerp(500,755,u);by=lerp(455,300,u);py=285;hanging(bx,by);ring(bx,by-55,112,palette.open,.7,true);}
      dash=t>.87&&t<1.17||t>2.18&&t<2.49;player(px,py,dash);return phase;
    }
    function drawUpper(t){let phase='Aviso',px=420,py=250;
      if(t<1.25){hanging(710-Math.sin(t*3)*35,390);sprite('f0',675,390,.8);path([[650,440],[510,300],[400,135]]);}
      else if(t<2.35){phase='Gancho';const u=ease(t,1.25,2.04);const bx=lerp(675,410,u),by=lerp(440,170,u);path([[650,440],[510,300],[400,135]],palette.danger);sprite('f3',bx,by,.92,-.15);px=lerp(420,240,ease(t,1.14,1.61));py=250;ring(bx-75,by-150,50,palette.warning,.8);}
      else{phase='Abertura';const u=ease(t,3.15,4.8);hanging(lerp(410,755,u),lerp(190,300,u));px=240;ring(lerp(410,755,u),lerp(150,245,u),110,palette.open,.6,true);}
      player(px,py);return phase;
    }
    function drawDive(t){let phase='Aviso',px=420,py=360;
      if(t<1.3){sprite('f4',680,190,.82,-.12);ring(420,360,88,palette.warning,.9,true);path([[640,170],[420,360]]);}
      else if(t<2.1){phase='Martelo';let u=ease(t,1.3,1.84);sprite('f5',lerp(680,552,u),lerp(160,263,u),.88);zone(340,280,160,160,palette.danger,.12);ring(420,360,88,palette.danger,.8);px=lerp(420,215,ease(t,1.18,1.64));}
      else{phase='Abertura';if(t<2.8)impact(420,360,(t-2.1)/.7);let u=ease(t,3.35,4.9);hanging(lerp(552,755,u),lerp(263,300,u));ring(lerp(552,755,u),lerp(208,245,u),105,palette.open,.65,true);px=215;}
      player(px,py);return phase;
    }
    function drawKick(t){let phase='Embalo',px=430,py=330;
      if(t<1.5){hanging(755+Math.sin(t*7)*55,280-Math.cos(t*7)*12,Math.sin(t*7)*.16);if(t>.65)path([[740,280],[80,365]]);}
      else if(t<2.65){phase='Chute';const u=ease(t,1.5,2.55),bx=lerp(755,-210,u),by=lerp(280,390,u);sprite('kick',bx,by,.88,-.08);line([[bx+120,by-20],[bx-95,by]],palette.warning,8,.45);ring(bx-140,by+12,42,palette.warning,.6);px=430;py=lerp(330,165,ease(t,1.55,1.85));if(t<2)path([[430,330],[430,165]],palette.dodge);}
      else if(t<5.3){phase='Volta ao fundo';const u=ease(t,2.95,5.3);sprite('f0',lerp(-90,1110,u),150-Math.sin(u*Math.PI)*15,.27,0,true,.65);px=430;py=165;}
      else{phase='Retoma o cipó';const u=ease(t,5.3,6.4);hanging(lerp(1110,755,u),lerp(160,280,u));px=430;py=lerp(165,330,ease(t,6.1,7.1));}
      player(px,py,t>1.55&&t<1.9);return phase;
    }
    function render(){ctx.imageSmoothingEnabled=false;arena();const {move,t}=selected();const phase=move.id==='jab'?drawJab(t):move.id==='upper'?drawUpper(t):move.id==='dive'?drawDive(t):drawKick(t);const key=move.id+phase;
      if(key!==lastLabel){caption.textContent=move.name;status.textContent=phase;detail.textContent=move.detail;lastLabel=key;}
      const p=Math.min(100,elapsed/duration()*100);progress.style.width=p+'%';track.setAttribute('aria-valuenow',Math.round(p));
    }
    function frame(now){if(!root.isConnected)return;if(playing){elapsed=Math.min(duration(),elapsed+(last?Math.min(.06,(now-last)/1000):0));if(elapsed>=duration()){playing=false;button.textContent='Reproduzir';}}last=now;render();requestAnimationFrame(frame);}
    colors();new MutationObserver(colors).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    Promise.all(Object.entries(raw).map(([name,src])=>new Promise(resolve=>{const image=new Image();image.onload=()=>{images[name]=image;resolve();};image.onerror=()=>resolve();image.src=src;}))).then(()=>{button.textContent=playing?'Pausar':'Reproduzir';requestAnimationFrame(frame);});
  })();
  </script>
</div>
