&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;monkey-helper-study&#x27;),canvas=root.querySelector(&#x27;#mh-arena&#x27;),ctx=canvas.getContext(&#x27;2d&#x27;);
    const selector=root.querySelector(&#x27;#mh-role&#x27;),button=root.querySelector(&#x27;#mh-play&#x27;),name=root.querySelector(&#x27;#mh-name&#x27;),state=root.querySelector(&#x27;#mh-state&#x27;),detail=root.querySelector(&#x27;#mh-detail&#x27;);
    const progress=root.querySelector(&#x27;#mh-progress&#x27;),track=root.querySelector(&#x27;[role=&quot;progressbar&quot;]&#x27;);
    const raw=JSON.parse(root.querySelector(&#x27;#mh-assets&#x27;).textContent),images={},palette={};
    const roles=[
      {id:&#x27;batter&#x27;,name:&#x27;Batedor&#x27;,tip:&#x27;Faixas nos punhos · soco em linha reta; escape mudando de altura.&#x27;},
      {id:&#x27;acrobat&#x27;,name:&#x27;Acrobata&#x27;,tip:&#x27;Faixa na cabeça · chute em arco curto; afaste-se do alcance do cipó.&#x27;},
      {id:&#x27;roller&#x27;,name:&#x27;Rolador&#x27;,tip:&#x27;Pelo cinza-azulado · enrola o rabo e avança; desvie para fora da curva.&#x27;}
    ];
    let mode=&#x27;group&#x27;,elapsed=0,last=0,lastLabel=&#x27;&#x27;,playing=!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    const lerp=(a,b,t)=&gt;a+(b-a)*Math.max(0,Math.min(1,t));
    const ease=(t,a,b)=&gt;{let u=Math.max(0,Math.min(1,(t-a)/(b-a)));return u*u*(3-2*u);};
    const probe=document.createElement(&#x27;span&#x27;);probe.className=&#x27;sr-only&#x27;;probe.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);root.append(probe);
    function colors(){for(const [key,token] of Object.entries({warning:&#x27;--orange&#x27;,dodge:&#x27;--blue&#x27;,open:&#x27;--green&#x27;,danger:&#x27;--red&#x27;,surface:&#x27;--background&#x27;})){probe.style.color=&#x27;var(&#x27;+token+&#x27;)&#x27;;palette[key]=getComputedStyle(probe).color;}}
    function save(){window.openai?.setWidgetState?.({modelContent:{conceito:&#x27;Tropinha do Macaquini&#x27;,reforco:mode},privateContent:{role:mode}}).catch(()=&gt;{});}
    function choose(value,persist){mode=value===&#x27;group&#x27;||roles.some(r=&gt;r.id===value)?value:&#x27;group&#x27;;selector.value=mode;elapsed=0;lastLabel=&#x27;&#x27;;if(persist)save();}
    choose(window.openai?.widgetState?.privateContent?.role||&#x27;group&#x27;,false);
    window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{const saved=e.detail?.globals?.widgetState?.privateContent?.role;if(saved)choose(saved,false);});
    selector.addEventListener(&#x27;change&#x27;,()=&gt;{choose(selector.value,true);playing=true;button.textContent=&#x27;Pausar&#x27;;});
    const duration=()=&gt;mode===&#x27;group&#x27;?15.6:5.2;
    button.addEventListener(&#x27;click&#x27;,()=&gt;{if(elapsed&gt;=duration())elapsed=0;playing=!playing;button.textContent=playing?&#x27;Pausar&#x27;:&#x27;Reproduzir&#x27;;});
    function line(points,color,width=3,alpha=1,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap=&#x27;round&#x27;;ctx.globalAlpha=alpha;ctx.setLineDash(dash);ctx.beginPath();points.forEach((p,i)=&gt;i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
    function ring(x,y,r,color,alpha=.8){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
    function arrow(points,color=palette.warning){line(points,color,3,.9,[8,7]);const a=points[points.length-2],b=points[points.length-1],v=Math.atan2(b[1]-a[1],b[0]-a[0]);line([[b[0]-17*Math.cos(v-.5),b[1]-17*Math.sin(v-.5)],b,[b[0]-17*Math.cos(v+.5),b[1]-17*Math.sin(v+.5)]],color,3);}
    function sprite(key,x,y,size=.42,angle=0,alpha=1){const im=images[key];if(!im)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size);ctx.globalAlpha=alpha;if(key.startsWith(&#x27;m&#x27;))ctx.drawImage(im,-217.6,-304.64,435.2,435.2);else ctx.drawImage(im,-196,-240,384,384);ctx.restore();}
    function background(){ctx.imageSmoothingEnabled=false;const dx=Math.sin(elapsed*.18)*8;ctx.drawImage(images.jungle,-10+dx,-4,1020,568);ctx.globalAlpha=.65;ctx.drawImage(images.trunks,-12+dx*.5,0,1024,560);ctx.globalAlpha=1;ctx.drawImage(images.canopy,-10+dx*.8,0,1020,560);for(const x of [50,960]){ctx.save();ctx.translate(x,-35);ctx.rotate(Math.sin(elapsed*.7+x)*.025);ctx.drawImage(images.vine,-20,0,45,350);ctx.restore();}}
    function boss(){line([[910,-20],[905,30]],palette.open,5,.6);sprite(&#x27;hang&#x27;,885,180,.78);}
    function ship(x,y,dash){const im=images.player;if(dash){ctx.globalAlpha=.25;ctx.drawImage(im,x-43,y+3,86,55);ctx.globalAlpha=.12;ctx.drawImage(im,x-43,y+24,86,55);}ctx.globalAlpha=1;ctx.drawImage(im,x-43,y-27,86,55);}
    function move(i,t){let x=650,y=350,angle=0,pose=&#x27;m&#x27;+i,phase=&#x27;Entrada&#x27;,px=350,py=335,dash=false;
      if(i===0){
        if(t&lt;.8){x=lerp(1100,650,ease(t,0,.8));y=lerp(210,350,ease(t,0,.8));}
        else if(t&lt;1.6){phase=&#x27;Aviso · punho recolhido&#x27;;arrow([[615,335],[235,335]]);}
        else if(t&lt;2.4){phase=&#x27;Soco de passagem&#x27;;pose=&#x27;m3&#x27;;x=lerp(650,265,ease(t,1.6,2.28));y=350;line([[x+10,y-16],[x-68,y-16]],palette.warning,5,.65);py=lerp(335,455,ease(t,1.48,1.83));dash=t&lt;1.9;}
        else{phase=&#x27;Exposto · saída&#x27;;x=lerp(265,-120,ease(t,3.05,4.65));y=lerp(350,100,ease(t,3.05,4.65));py=455;if(t&lt;3.1)ring(x,y-18,62,palette.open);}
      }else if(i===1){
        const pivot=[725,-25];
        if(t&lt;.8){x=lerp(1040,745,ease(t,0,.8));y=lerp(90,300,ease(t,0,.8));}
        else if(t&lt;1.6){x=745;y=300;phase=&#x27;Aviso · joelhos recolhidos&#x27;;arrow([[735,285],[610,350],[405,350]]);}
