<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Comparação do idle</title>
<style>body{margin:20px;background:#f5f4ef;color:#283b2c;font:16px system-ui}h1{font-size:22px}main{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0}img{display:block;width:384px;height:384px;background:#e2e4e6;image-rendering:pixelated}figcaption{padding:8px 0}nav{display:flex;gap:10px;margin:16px 0}button{padding:8px 12px;font:inherit;cursor:pointer}#native img{width:64px;height:64px}#native{display:flex;gap:16px;margin-top:20px}#gif{width:408px;height:192px}@media(max-width:600px){main img{width:192px;height:192px}main{gap:16px}}</style>
<h1>Comparação do idle</h1><nav><button id="pause">Pausar</button><button id="speed">Lento</button><button id="next">Próximo frame</button></nav>
<figure><figcaption>GIF entregue · anterior à esquerda, revisado à direita</figcaption><img id="gif" alt="GIF de comparação animado" src="crocodilo-idle-comparacao.gif"></figure>
<main><figure><figcaption>Anterior</figcaption><img id="old" alt="Idle anterior" src="before/idle_00.png"></figure><figure><figcaption>Revisado</figcaption><img id="new" alt="Idle revisado" src="frames/idle_00.png"></figure></main>
<div id="native"><figure><figcaption>Anterior · 64×64</figcaption><img id="oldNative" alt="Anterior em tamanho nativo" src="before/idle_00.png"></figure><figure><figcaption>Revisado · 64×64</figcaption><img id="newNative" alt="Revisado em tamanho nativo" src="frames/idle_00.png"></figure></div><p id="status">Repouso</p>
<script>const dur=[450,250,450,350],names=['Repouso','Inspiração','Ápice','Expiração'];let playing=true,rate=1,time=0,last=performance.now(),f=-1;const before=[],after=[];for(let i=0;i<4;i++){before[i]=new Image;before[i].src='before/idle_0'+i+'.png';after[i]=new Image;after[i].src='frames/idle_0'+i+'.png'}function show(i){f=i;for(let id of ['old','oldNative'])document.getElementById(id).src=before[i].src;for(let id of ['new','newNative'])document.getElementById(id).src=after[i].src;document.body.dataset.frame=String(i);document.getElementById('status').textContent=names[i]+' · '+dur[i]+' ms · ciclos: '+Math.floor(time/1500)}document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'Pausar':'Reproduzir'};document.getElementById('speed').onclick=()=>{rate=rate===1?.25:1;document.getElementById('speed').textContent=rate===1?'Lento':'Normal'};document.getElementById('next').onclick=()=>{playing=false;document.getElementById('pause').textContent='Reproduzir';const i=(f+1)%4;time=[0,450,700,1150][i];show(i)};function tick(now){if(playing)time+=(now-last)*rate;last=now;let t=time%1500,i=t<450?0:t<700?1:t<1150?2:3;if(playing&&i!==f)show(i);requestAnimationFrame(tick)}show(0);requestAnimationFrame(tick)</script></html>
