name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Unity project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scenes, assets and generated files
        run: python3 "Crocodilo Invaders/Tools/validate_ci.py" "Crocodilo Invaders"

  windows:
    name: Build and publish Windows player
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Unity activation configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Configure UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in repository Actions secrets. See Crocodilo Invaders/Docs/BuildWindows.md.'
            exit 1
          fi
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Crocodilo Invaders/Library
          key: windows-unity-${{ hashFiles('Crocodilo Invaders/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Crocodilo Invaders/Assets/**', 'Crocodilo Invaders/Packages/**', 'Crocodilo Invaders/ProjectSettings/**') }}
          restore-keys: |
            windows-unity-${{ hashFiles('Crocodilo Invaders/ProjectSettings/ProjectVersion.txt') }}-
      - name: Compile Windows x64 and validate gameplay data
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Crocodilo Invaders
          unityVersion: auto
          customImage: unityci/editor:ubuntu-6000.6.4f1-windows-mono-3
          targetPlatform: StandaloneWindows64
          buildName: CrocodiloInvaders
          buildsPath: build
          buildMethod: CrocodiloWindowsBuild.Build
          manualExit: true
          versioning: Custom
          version: 1.0.${{ github.run_number }}
      - name: Package the complete Windows player
        shell: bash
        run: |
          set -euo pipefail
          player=build/StandaloneWindows64
          test -s "$player/CrocodiloInvaders.exe"
          test -s "$player/UnityPlayer.dll"
          test -d "$player/CrocodiloInvaders_Data"
          mkdir -p dist
          printf 'Extract every file in this ZIP to the same folder, then run CrocodiloInvaders.exe.\n' > "$player/README.txt"
          (cd "$player" && zip -q -r "$GITHUB_WORKSPACE/dist/CrocodiloInvaders-Windows.zip" .)
          (cd dist && sha256sum CrocodiloInvaders-Windows.zip > SHA256SUMS.txt)
      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CrocodiloInvaders-Windows-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: windows-${{ github.run_number }}-${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Crocodilo Invaders - Windows build ${context.runNumber}`,
                body: 'Download CrocodiloInvaders-Windows.zip, extract all files and run CrocodiloInvaders.exe.\n\nBuilt automatically from main. SHA256SUMS.txt contains the download checksum.',
                draft: true, prerelease: false
              })).data;
            }
            for (const name of ['CrocodiloInvaders-Windows.zip', 'SHA256SUMS.txt']) {
              const previous = release.assets.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(`dist/${name}`)
              });
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, make_latest: 'true' });
            await core.summary.addHeading('Windows build published')
              .addLink('Download the complete Windows player', release.html_url).write();
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics-${{ github.run_number }}
          path: |
            Crocodilo Invaders/Logs/**
            build/**/BuildReport.json
          if-no-files-found: ignore
          retention-days: 7
